<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>切图命名面板</title>
  <link rel="stylesheet" href="./shared/panel.css" />
</head>
<body>
  <div class="plugin-shell compact-shell">
    <header class="plugin-header compact-header">
      <div>
        <p class="eyebrow">Photoshop UXP 插件</p>
        <div class="title-row">
          <h1>切图命名面板</h1>
          <button id="refresh-target" class="icon-button" type="button" title="刷新当前选中对象">&#x21bb;</button>
        </div>
        <p class="subtitle">用于重命名并导出当前选中的组、图层或画板。</p>
      </div>
    </header>

    <main class="panel-grid single-column">
      <section class="panel">
        <div class="section-head">
          <h2>命名生成</h2>
          <p>前缀固定为 UI，具体命名值保持英文。</p>
        </div>
        <form id="naming-form" class="form-grid">
          <label><span>前缀</span><input id="prefix" name="prefix" type="text" value="UI" readonly /></label>
          <label><span>关键词</span><input id="keyword" name="keyword" type="text" value="Product" /></label>
          <label><span>组件类型</span><select id="component-type" name="componentType"></select></label>
          <label><span>状态</span><select id="state" name="state"></select></label>
          <label><span>编号</span><select id="number" name="number"></select></label>
          <label><span>尺寸</span><select id="size" name="size"></select></label>
          <label class="full-width"><span>导出格式</span><select id="export-format" name="exportFormat"></select></label>
        </form>
      </section>

      <section class="panel">
        <div class="section-head">
          <h2>生成结果</h2>
          <p>直接复制完整名称，或单击导出当前选中对象。</p>
        </div>
        <div class="result-card">
          <p class="card-label">完整名称</p>
          <h3 id="full-name">UIProductButton</h3>
          <p class="hint">顺序：前缀 / 关键词 / 组件类型 / 状态 / 编号 / 尺寸</p>
        </div>
        <div class="action-row compact-actions">
          <button id="copy-full-name" class="secondary-button" type="button">一键复制完整名称</button>
          <button id="export-now" class="primary-button" type="button">导出当前选中对象</button>
        </div>
      </section>
    </main>

    <section class="panel">
      <div class="section-head">
        <h2>校验结果</h2>
        <p>实时检查允许字符和禁用词，重复命名在导出前检查。</p>
      </div>
      <ul id="validation-results" class="validation-list"></ul>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>状态</h2>
        <p>显示 Photoshop UXP 宿主侧的执行结果。</p>
      </div>
      <div id="status-message" class="status-message idle">已就绪。</div>
    </section>
  </div>
  <script src="./shared/naming-core.js"></script>
  <script src="./shared/panel-app.js"></script>
  <script src="main.js"></script>
</body>
</html>
